<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NJORD — parcours 2027</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="xlsx.js"></script>
  <script src="routes-file.js"></script>
  <script src="store.js"></script>
  <script src="weather.js"></script>
  <script src="sea-route.js"></script>
  <script src="route-wind.js"></script>
  <script src="moon.js"></script>
  <style>
    :root { --route: #1d4e89; --trial: #7d3c98; --trial-land: #c0392b; --line: #d6dde6; }
    html, body { height: 100%; margin: 0; }
    body { display: flex; flex-direction: column; font-family: system-ui, sans-serif; color: #1d2b3a; }
    button { font: inherit; }

    .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; padding: 6px 12px; background: var(--route); color: #fff; }
    .bar h1 { margin: 0; font-size: 15px; letter-spacing: 0.03em; white-space: nowrap; }
    .stages { display: flex; flex-wrap: wrap; align-items: center; gap: 3px; }
    .tab { padding: 2px 6px; border: 1px solid rgba(255, 255, 255, 0.45); border-radius: 3px; background: transparent; color: #fff; font-size: 12px; font-variant-numeric: tabular-nums; cursor: pointer; }
    .tab:hover { background: rgba(255, 255, 255, 0.15); }
    .tab.active { background: #fff; color: var(--route); font-weight: 700; }
    .tab.voyage { margin-right: 6px; padding: 2px 10px; }
    .tab.has-manual { box-shadow: inset 0 -3px 0 #c9a3dc; }
    .file-box { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-left: auto; font-size: 12px; }
    .file-box .name { opacity: 0.9; }
    .file-box .state { padding: 1px 6px; border-radius: 3px; background: #ffd84d; color: #1d2b3a; font-weight: 600; }
    .file-box button { padding: 2px 9px; border: 1px solid #fff; border-radius: 3px; background: #fff; color: var(--route); font-size: 12px; cursor: pointer; }
    .file-box button.quiet { background: transparent; color: #fff; }
    .file-box button.confirm { background: #ffd84d; border-color: #ffd84d; color: #1d2b3a; }
    .file-box button:disabled { opacity: 0.45; cursor: default; }
    .message { display: flex; gap: 10px; align-items: baseline; padding: 6px 12px; background: #eef3f9; font-size: 13px; }
    .message.error { background: #fbe3e0; color: #8a1f14; }
    .message[hidden] { display: none; }
    .message button { margin-left: auto; border: none; background: none; font-size: 16px; cursor: pointer; color: inherit; }

    .main { display: flex; flex: 1; min-height: 0; }
    #map { flex: 1; min-width: 0; }
    .side { box-sizing: border-box; width: clamp(360px, 40vw, 580px); overflow: auto; padding: 12px 16px; border-left: 1px solid var(--line); background: #fff; font-size: 13px; }
    @media (max-width: 800px) {
      .main { flex-direction: column; }
      #map { flex: none; height: 45vh; }
      .side { flex: 1; width: auto; border-top: 1px solid var(--line); border-left: none; }
    }
    .side h2 { margin: 0 0 4px; font-size: 16px; }
    .side h3 { margin: 16px 0 4px; font-size: 12px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--route); }
    .side .small { color: #666; font-size: 11px; }
    .side .credit { margin-top: 14px; color: #666; font-size: 11px; }
    .manual-text { color: var(--trial); }
    .warning { color: var(--trial-land); }

    .pace { margin: 10px 0 4px; font-size: 12px; }
    .pace input { width: 52px; }
    .why { margin-left: 4px; width: 16px; height: 16px; padding: 0; border: 1px solid var(--route); border-radius: 50%; background: #fff; color: var(--route); font-size: 10px; line-height: 14px; cursor: pointer; vertical-align: 1px; }
    .rose-tip, .why-tip { position: fixed; z-index: 2000; max-width: 230px; padding: 6px 9px; border-radius: 4px; background: #fff; box-shadow: 0 1px 5px rgba(0, 0, 0, 0.35); font-size: 12px; line-height: 1.45; pointer-events: none; }
    .why-tip { max-width: 300px; }
    .rose-tip[hidden], .why-tip[hidden] { display: none; }
    .rose-tip .bands { color: #444; }
    .rose-tip .swatch { display: inline-block; width: 10px; height: 10px; margin: 0 3px 0 6px; vertical-align: -1px; }
    .rose-tip .swatch:first-child { margin-left: 0; }
    .rose-tip .other { color: #666; }

    .figures-table { width: 100%; margin: 8px 0 4px; border-collapse: collapse; font-size: 12px; }
    .figures-table th, .figures-table td { padding: 3px 6px; text-align: right; vertical-align: top; }
    .figures-table th:first-child, .figures-table td:first-child { text-align: left; }
    .figures-table tr + tr td { border-top: 1px solid #eee; }
    .figures-table .group th { padding-top: 10px; text-align: left; }
    .voyage-table th { font-weight: 600; vertical-align: bottom; }
    .voyage-table td:nth-child(2), .voyage-table th:nth-child(2) { text-align: left; }
    .voyage-table tbody tr { cursor: pointer; }
    .voyage-table tbody tr:hover, .voyage-table tbody tr:focus { background: #eef3f9; outline: none; }
    .voyage-table .leg { font-weight: 700; color: var(--route); }
    .voyage-table .total td { border-top: 2px solid var(--line); font-weight: 600; }
    .voyage-table .late { color: var(--trial-land); }
    .voyage-table td:nth-child(n+3) { white-space: nowrap; }

    .wind-block .roses { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px; }
    .wind-block .roses h4 { margin: 4px 0 0; font-size: 13px; text-align: center; }
    .wind-block .roses .small { text-align: center; }
    .wind-block .period { margin: 6px 0 10px; padding: 6px 10px; border-radius: 4px; background: #eef3f9; font-size: 14px; font-weight: 600; text-align: center; }
    .wind-block .period span { display: block; color: #666; font-size: 11px; font-weight: normal; }
    .wind-block .rose { display: block; width: 100%; max-width: 320px; margin: 4px auto; }
    .wind-block .ring { fill: none; stroke: #ccc; stroke-width: 0.8; }
    .wind-block .ring-label { fill: #666; font-size: 8px; paint-order: stroke; stroke: #fff; stroke-width: 3px; }
    .wind-block .cardinal { fill: #333; font-size: 11px; font-weight: 700; text-anchor: middle; }
    .wind-block .allure { fill: #666; font-size: 10px; font-style: italic; text-anchor: middle; }
    .wind-block .allure-limit { stroke: #555; stroke-width: 1; stroke-dasharray: 3 3; }
    .wind-block .hit { fill: transparent; }
    .wind-block .hit:hover { fill: rgba(29, 78, 137, 0.1); stroke: var(--route); stroke-width: 1; }
    .hull { fill: #fff; stroke: var(--route); stroke-width: 2; }
    .scale { margin: 6px 0 4px; font-size: 10px; }
    .scale-bar { display: flex; height: 15px; overflow: hidden; border-radius: 3px; }
    .scale-bar span { display: flex; align-items: center; justify-content: center; font-weight: 600; }
    .scale-ticks { position: relative; height: 13px; color: #555; }
    .scale-ticks span { position: absolute; top: 1px; transform: translateX(-50%); }
    .scale-ticks span:first-child { transform: none; }
    .scale-ticks .unit { right: 0; transform: none; }
    .progress { position: relative; margin: 4px 0; overflow: hidden; border-radius: 10px; background: #e3eaf2; color: #1d2b3a; font-size: 11px; font-weight: 600; line-height: 1.3; }
    .progress .fill { position: absolute; top: 0; bottom: 0; left: 0; width: 0; background: #9dbbe0; transition: width 0.2s; }
    .progress .text { position: relative; display: block; padding: 3px 10px; text-align: center; }
    .progress.error { background: #fbe3e0; color: #8a1f14; }
    .wind-manual, .trial button { padding: 3px 9px; border: 1px solid var(--trial); border-radius: 3px; background: #fff; color: var(--trial); font-size: 12px; cursor: pointer; }

    .leg-links .gpx { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 8px; }
    .leg-links button { padding: 3px 9px; border: 1px solid var(--route); border-radius: 3px; background: #fff; color: var(--route); font-size: 12px; cursor: pointer; }
    .tide-strip { display: flex; gap: 1px; margin: 4px 0 2px; }
    .tide-strip span { flex: 1; min-width: 0; text-align: center; font-size: 11px; line-height: 22px; }
    .tide-marks { display: flex; gap: 1px; color: #444; font-size: 10px; }
    .tide-marks span { flex: 1; min-width: 0; overflow: visible; white-space: nowrap; }
    .tide-strip .leg-day { box-shadow: inset 0 -3px 0 #ffd84d; }
    .trial { margin-top: 10px; padding: 8px 10px; border-left: 3px solid var(--trial); background: #faf6fc; }
    .trial h3 { margin-top: 0; color: var(--trial); }
    .trial .figures { margin: 6px 0; line-height: 1.5; }
    .trial .figures b { color: var(--trial); }
    .trial ol { margin: 4px 0; padding-left: 22px; font-variant-numeric: tabular-nums; font-size: 12px; }
    .trial .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }

    .legend { padding: 5px 9px; border-radius: 6px; background: rgba(255, 255, 255, 0.94); box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3); font-size: 11px; max-width: 240px; }
    .legend div { display: flex; align-items: center; gap: 8px; margin: 2px 0; }
    .legend svg { flex: none; width: 28px; height: 12px; }
    .legend .route { stroke: var(--route); stroke-width: 3; }
    .legend .manual { stroke: var(--trial); stroke-width: 3; }
    .legend .port { fill: var(--route); stroke: var(--route); stroke-width: 2; }
    .legend [hidden] { display: none; }
    .port-label { padding: 0 4px; border: none; background: none; box-shadow: none; color: #1d2b3a; font-weight: 600; text-shadow: 0 0 3px #fff, 0 0 3px #fff, 0 0 3px #fff; }
    .port-label::before { display: none; }
    .leaflet-container.trial-mode { cursor: crosshair; }
    .trial-point { box-sizing: border-box; border: 2px solid #fff; border-radius: 50%; background: var(--trial); box-shadow: 0 0 0 1px var(--trial); cursor: grab; }
    .leg-number {
      display: flex; flex: none; align-items: center; justify-content: center; box-sizing: border-box;
      width: 22px; height: 22px; border: 2px solid var(--route); border-radius: 50%;
      background: #fff; color: var(--route); font-size: 11px; font-weight: 700; cursor: pointer;
    }
  </style>
</head>
<body>
  <header class="bar">
    <h1 class="title"></h1>
    <nav class="stages" aria-label="Étapes"></nav>
    <div class="file-box">
      <span class="name"></span><span class="state" hidden>modifié</span>
      <button type="button" class="open quiet">Ouvrir…</button>
      <input type="file" class="file-input" accept=".xlsx" hidden>
      <button type="button" class="save">Enregistrer</button>
      <button type="button" class="site quiet" hidden>Fichier du site</button>
    </div>
  </header>
  <div class="message" role="status" hidden></div>
  <main class="main">
    <div id="map"></div>
    <aside class="side"><h2>Chargement du fichier de parcours…</h2></aside>
  </main>
  <div class="rose-tip" hidden></div>
  <div class="why-tip" hidden></div>
  <script>
    // Written by ./update.sh beside the site, with the coast mask it goes with.
    const SITE_FILE_URL = 'parcours.xlsx';
    const KEPT_FILE = 'routes-file';
    const ROUTE_COLOR = getComputedStyle(document.documentElement).getPropertyValue('--route').trim();
    const TRIAL_COLOR = getComputedStyle(document.documentElement).getPropertyValue('--trial').trim();
    const METERS_PER_NM = 1852;

    // A canvas with a hit tolerance, so that the thin legs are easy to hover and click.
    const map = L.map('map', { renderer: L.canvas({ tolerance: 8 }), zoomSnap: 0.25 }).setView([48, 2], 4);
    // Keyless tile services. The light gray keeps the routes readable, so it opens by default.
    const ESRI = 'https://server.arcgisonline.com/ArcGIS/rest/services';
    const BASE_MAPS = {
      'Esri gris clair': L.tileLayer(`${ESRI}/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}`, {
        maxZoom: 16,
        attribution: 'Tiles &copy; Esri &mdash; Esri, DeLorme, NAVTEQ',
      }),
      'Esri océans': L.tileLayer(`${ESRI}/Ocean/World_Ocean_Base/MapServer/tile/{z}/{y}/{x}`, {
        maxZoom: 16,
        // Past this level the ocean base has no tiles of its own: the last ones are enlarged.
        maxNativeZoom: 13,
        attribution: 'Tiles &copy; Esri &mdash; GEBCO, NOAA, CHS, OSU, UNH, CSUMB, National Geographic, DeLorme, NAVTEQ, Esri',
      }),
      'Esri satellite': L.tileLayer(`${ESRI}/World_Imagery/MapServer/tile/{z}/{y}/{x}`, {
        maxZoom: 16,
        attribution: 'Tiles &copy; Esri &mdash; Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, GIS User Community',
      }),
      'OpenStreetMap': L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 16,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">les contributeurs d’OpenStreetMap</a>',
      }),
    };
    BASE_MAPS['Esri gris clair'].addTo(map);
    L.control.layers(BASE_MAPS, null, { position: 'bottomright' }).addTo(map);

    const side = document.querySelector('.side');
    const bar = document.querySelector('.bar');
    // A highlighter band under the shown leg, kept below every line so that the leg stays drawn as
    // it is. Its pale yellow is none of the wind's force colours.
    const legHighlight = L.polyline([], { color: '#ffd84d', weight: 14, opacity: 0.75, interactive: false });
    const drawn = L.layerGroup().addTo(map);
    const statsPoints = L.layerGroup();
    // A message shown or closed above the map changes its height: Leaflet has to be told.
    new ResizeObserver(() => map.invalidateSize()).observe(document.getElementById('map'));

    const legend = L.control({ position: 'bottomleft' });
    legend.onAdd = () => {
      const box = L.DomUtil.create('div', 'legend');
      box.innerHTML =
        `<div><svg viewBox="0 0 28 12"><line class="route" x1="0" y1="6" x2="28" y2="6"/></svg><span class="route-label">Parcours auto</span></div>` +
        `<div class="trial-legend" hidden><svg viewBox="0 0 28 12"><line class="manual" x1="0" y1="6" x2="28" y2="6"/></svg>Parcours manuel : passages posés à la main</div>` +
        `<div><svg viewBox="0 0 28 12"><circle class="port" cx="14" cy="6" r="5"/></svg>Port (cliquer : ses dates)</div>`;
      L.DomEvent.disableClickPropagation(box);
      return box;
    };
    legend.addTo(map);

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, char => `&#${char.charCodeAt(0)};`);
    }

    // A bar with its explanation written inside it.
    function progressBar(fraction, text, error = false) {
      return `<div class="progress${error ? ' error' : ''}"><div class="fill" style="width: ${fraction * 100}%"></div>` +
        `<span class="text">${escapeHtml(text)}</span></div>`;
    }

    const utcDate = isoDate => new Date(`${isoDate}T00:00:00Z`);

    function formatDate(value, options = { year: 'numeric' }) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(value ?? '')) return String(value ?? '');
      return utcDate(value).toLocaleDateString('fr-CH', { day: 'numeric', month: 'short', timeZone: 'UTC', ...options });
    }

    function dayMonth(isoDate, shiftDays) {
      const date = utcDate(isoDate);
      date.setUTCDate(date.getUTCDate() + shiftDays);
      return date.toLocaleDateString('fr-CH', { day: 'numeric', month: 'long', timeZone: 'UTC' });
    }

    function formatHours(hours) {
      const total = Math.round(Math.abs(hours));
      const days = Math.floor(total / 24);
      return days ? `${days} j ${total % 24} h` : `${total} h`;
    }

    function formatDistance(value) {
      const text = String(value ?? '');
      return text.includes('NM') ? text : `${text} NM`;
    }

    // A rare gale rounds to 0 %, which would read as never.
    const windPercent = share => (share > 0 && share < 0.005 ? 'moins de 1 %' : `${Math.round(share * 100)} %`);
    const tipPercent = share => `${(share * 100).toLocaleString('fr-CH', { maximumFractionDigits: share < 0.1 ? 1 : 0 })} %`;
    const pathNm = path => path.slice(1).reduce((sum, to, i) => sum + map.distance(path[i], to), 0) / METERS_PER_NM;
    // Both dates of the leg count.
    const plannedHours = leg => ((utcDate(leg['Arrivée prévue']) - utcDate(leg['Départ prévu'])) / 86_400_000 + 1) * 24;


    let file = null;
    let fileBytes = null;
    // 'site' (its copy beside the page), 'opened' (« Ouvrir… ») or 'saved' (« Enregistrer »).
    let fileOrigin = 'site';
    let modified = false;
    let siteFile = null;
    let siteBytes = null;
    let windStats = null;
    let trialSpeed = 5;
    // How close to the wind the boat sails, in degrees: closer than that, it tacks.
    let pointingDeg = 45;
    let allBounds = null;

    const legRoutes = new Map();
    const trials = new Map();
    const seaStretches = new Map();
    // The wind of the manual routes, by what it was computed for (routeFingerprint): from the file,
    // or computed in the browser.
    const manualWinds = new Map();
    let shownRoute = null;
    let editing = null;
    let trialMessage = '';
    let coastMask;
    let coast = null;

    function showMessage(text, kind = 'info') {
      const box = document.querySelector('.message');
      box.className = `message ${kind}`;
      box.hidden = false;
      box.innerHTML = `<span>${escapeHtml(text)}</span><button type="button" aria-label="Fermer">×</button>`;
      box.querySelector('button').addEventListener('click', () => { box.hidden = true; });
    }

    function download(name, blob) {
      const link = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: name });
      document.body.append(link);
      link.click();
      link.remove();
      // Revoked at once, the address would be gone before the browser starts the download.
      setTimeout(() => URL.revokeObjectURL(link.href), 1000);
    }

    const manualOf = parsed => Object.fromEntries(parsed.routes.filter(route => route.name === ROUTE_NAMES.manual)
      .map(route => [route.leg['Étape'], { mode: route.mode, passages: route.passages }]));

    // A file read, or the state the browser kept of one, replaces what the map shows.
    function useFile(parsed, bytes, { origin, manual = manualOf(parsed), speed = parsed.speed, pointing = parsed.pointing, changed = false }) {
      stopEditing();
      trials.forEach(trial => { trial.line.remove(); trial.markers.remove(); });
      trials.clear();
      file = parsed;
      fileBytes = bytes;
      fileOrigin = origin;
      modified = changed;
      windStats = parsed.wind;
      trialSpeed = speed;
      pointingDeg = pointing;
      for (const route of parsed.routes) {
        if (route.name === ROUTE_NAMES.manual && route.stats) manualWinds.set(route.stats.fingerprint, { stats: route.stats });
      }
      drawFile();
      for (const [key, { mode, passages }] of Object.entries(manual)) {
        const route = legRoutes.get(key);
        if (route && passages.length) placePassages(route, passages.map(([lat, lon]) => L.latLng(lat, lon)), mode);
      }
      if (trials.size) loadCoastMask();
      showFileBar();
      keep();
      showView();
    }

    // The browser keeps the file worked on, so that a reload finds it; the site's copy unchanged
    // needs no keeping, and a newer one then shows at once.
    function keep() {
      if (fileOrigin === 'site' && !modified) {
        storeDelete(KEPT_FILE);
        return;
      }
      storeSet(KEPT_FILE, {
        bytes: fileBytes,
        origin: fileOrigin,
        changed: modified,
        speed: trialSpeed,
        pointing: pointingDeg,
        manual: Object.fromEntries([...trials].map(([key, trial]) =>
          [key, { mode: trial.mode, passages: trial.points.map(({ lat, lng }) => [lat, lng]) }])),
      });
    }

    function markModified() {
      modified = true;
      showFileBar();
      keep();
    }

    function showFileBar() {
      const box = bar.querySelector('.file-box');
      const origin = { site: 'fichier du site', opened: 'ouvert', saved: 'enregistré' }[fileOrigin];
      box.querySelector('.name').textContent = `${file.name} · ${origin}`;
      box.querySelector('.name').title = `Tiré du tableur ${file.workbook}` +
        (siteFile && siteFile.version > file.version ? `. Le site a une version plus récente : ${siteFile.name}` : '');
      box.querySelector('.state').hidden = !modified;
      box.querySelector('.save').disabled = !modified;
      box.querySelector('.save').title = modified
        ? `Télécharger ${routesFileName(file.version + 1)}, à déposer dans le dossier NJORD_2027 du Drive` : 'Rien à enregistrer';
      box.querySelector('.site').hidden = fileOrigin === 'site' && !modified;
      bar.querySelector('.title').textContent = file.title;
      document.title = `${file.title} — parcours`;
    }

    // A button that drops unsaved changes asks a second click first.
    function guarded(button, act) {
      button.addEventListener('click', () => {
        if (!modified || button.classList.contains('confirm')) {
          button.classList.remove('confirm');
          button.textContent = button.dataset.label ?? button.textContent;
          act();
          return;
        }
        button.dataset.label = button.textContent;
        button.textContent = 'Modifications perdues : cliquer encore';
        button.classList.add('confirm');
        setTimeout(() => {
          button.classList.remove('confirm');
          button.textContent = button.dataset.label;
        }, 5000);
      });
    }

    const fileInput = bar.querySelector('.file-input');
    guarded(bar.querySelector('.open'), () => fileInput.click());
    fileInput.addEventListener('change', async () => {
      const chosen = fileInput.files[0];
      fileInput.value = '';
      if (!chosen) return;
      try {
        const bytes = await chosen.arrayBuffer();
        useFile(await readRoutesFile(bytes), bytes, { origin: 'opened' });
        showMessage(`${chosen.name} ouvert.`);
      } catch (error) {
        showMessage(`${chosen.name} refusé : ${error.message}.`, 'error');
      }
    });
    guarded(bar.querySelector('.site'), () => {
      useFile(siteFile, siteBytes, { origin: 'site' });
      showMessage(`Retour au fichier du site, ${siteFile.name}.`);
    });

    // Each leg's auto route, and its manual one when it has one, with the wind each carries.
    function routesToSave() {
      return [...legRoutes.values()].flatMap(route => {
        const trial = trials.get(legKey(route));
        if (!trial) return [route.auto];
        return [route.auto, {
          leg: route.leg,
          name: ROUTE_NAMES.manual,
          mode: trial.mode,
          passages: trial.points.map(({ lat, lng }) => [lat, lng]),
          path: trial.path,
          nm: pathNm(trial.path),
          stats: manualWinds.get(manualKey(route))?.stats ?? null,
        }];
      });
    }

    bar.querySelector('.save').addEventListener('click', async () => {
      stopEditing();
      try {
        const { name, bytes } = await writeRoutesFile(file, { routes: routesToSave(), speed: trialSpeed, pointing: pointingDeg });
        download(name, new Blob([bytes], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
        useFile(await readRoutesFile(bytes.buffer), bytes.buffer, { origin: 'saved' });
        showMessage(`${name} téléchargé. Déposé dans le dossier NJORD_2027 du Drive, il est repris par le prochain ./update.sh, ` +
          `qui calcule ce qui manque (le vent d'un parcours manuel pas encore calculé, par exemple).`);
      } catch (error) {
        showMessage(`Enregistrement impossible : ${error.message}.`, 'error');
      }
    });


    const legKey = route => route.leg['Étape'];
    const straightMode = route => (trials.get(legKey(route))?.mode ?? route.auto.mode) === ROUTE_MODES.straight;

    function drawFile() {
      drawn.clearLayers();
      legRoutes.clear();
      shownRoute = null;
      const bounds = L.latLngBounds([]);
      // One marker per position: a port where one leg ends and the next starts is drawn once, with
      // every name the workbook gives it.
      const ports = new Map();
      const visit = (at, name, line) => {
        const port = ports.get(String(at)) ?? ports.set(String(at), { at, names: [], lines: [] }).get(String(at));
        if (!port.names.includes(name)) port.names.push(name);
        port.lines.push(line);
      };
      file.legs.forEach(leg => {
        const ends = [leg['Position embarquement'], leg['Position débarquement']];
        // A file edited by hand may have lost a leg's auto route: drawn straight until ./update.sh computes it.
        const auto = file.routes.find(one => one.leg === leg && one.name === ROUTE_NAMES.auto) ??
          { leg, name: ROUTE_NAMES.auto, mode: ROUTE_MODES.straight, passages: [], path: ends, nm: null, stats: null, missing: true };
        auto.path ??= ends;
        auto.nm ??= pathNm(auto.path);
        const line = L.polyline(auto.path, {
          color: ROUTE_COLOR,
          weight: 3,
          // The leg handles its own clicks: the map's handler is for passages.
          bubblingMouseEvents: false,
        }).addTo(drawn);
        const route = { leg, auto, path: auto.path, ends, line };
        legRoutes.set(leg['Étape'], route);
        line.bindTooltip(() => `<b>Étape ${escapeHtml(leg['Étape'])} · ${escapeHtml(leg['Zone / itinéraire'])}</b><br>` +
          `${escapeHtml(formatDate(leg['Départ prévu']))} → ${escapeHtml(formatDate(leg['Arrivée prévue']))}<br>` +
          legDistances(route), { sticky: true });
        line.on('click', event => (editing ? addTrialPoint(event.latlng) : goTo(route)));
        bounds.extend(line.getBounds());
        route.number = L.marker(line.getCenter(), {
          icon: L.divIcon({ className: 'leg-number', html: escapeHtml(leg['Étape']), iconSize: [22, 22] }),
          title: `Étape ${leg['Étape']}`,
        }).on('click', () => (editing ? null : goTo(route))).addTo(drawn);
        visit(ends[0], leg['Embarquement hypothétique'],
          `Départ ${escapeHtml(formatDate(leg['Départ prévu']))} (étape ${escapeHtml(leg['Étape'])})`);
        visit(ends[1], leg['Débarquement hypothétique'],
          `Arrivée ${escapeHtml(formatDate(leg['Arrivée prévue']))} (étape ${escapeHtml(leg['Étape'])})`);
      });
      ports.forEach(({ at, names, lines }) => {
        L.circleMarker(at, {
          radius: 6, color: ROUTE_COLOR, weight: 2, fillColor: ROUTE_COLOR, fillOpacity: 1,
          // A click on a port opens its dates, not a leg.
          bubblingMouseEvents: false,
        })
          .bindTooltip(escapeHtml(names[0]), { permanent: true, direction: 'right', className: 'port-label' })
          .bindPopup([...names.map(name => `<b>${escapeHtml(name)}</b>`), ...lines].join('<br>'))
          .addTo(drawn);
      });
      allBounds = bounds;
      const label = document.querySelector('.legend .route-label');
      label.textContent = `Parcours auto : calculé, pas une route de navigation`;
      label.title = `Le plus court chemin en mer, à ${file.coast.coastDistanceNm} NM des côtes quand c'est possible ` +
        `(côtes : ${file.coast.coastline}).`;
      bar.querySelector('.stages').innerHTML =
        `<button type="button" class="tab voyage" data-leg="">Voyage</button>` +
        file.legs.map(leg => `<button type="button" class="tab" data-leg="${escapeHtml(leg['Étape'])}" ` +
          `title="${escapeHtml(leg['Zone / itinéraire'])}">${escapeHtml(leg['Étape'])}</button>`).join('');
      bar.querySelectorAll('.stages .tab').forEach(tab =>
        tab.addEventListener('click', () => goTo(legRoutes.get(tab.dataset.leg) ?? null)));
    }


    function goTo(route) {
      const hash = route ? `#etape-${legKey(route)}` : '#voyage';
      if (location.hash === hash) showView();
      else location.hash = hash;
    }

    function showView() {
      const route = legRoutes.get(location.hash.match(/^#etape-(\d+)$/)?.[1]);
      if (route) showLeg(route);
      else showVoyage();
    }

    window.addEventListener('hashchange', () => file && showView());

    function markTabs() {
      bar.querySelectorAll('.stages .tab').forEach(tab => {
        tab.classList.toggle('active', shownRoute ? tab.dataset.leg === legKey(shownRoute) : tab.dataset.leg === '');
        tab.classList.toggle('has-manual', trials.has(tab.dataset.leg));
      });
    }

    // The shown leg stands out; the others stay visible, faded.
    function fadeOthers() {
      legRoutes.forEach(route => {
        const opacity = !shownRoute || route === shownRoute ? 1 : 0.3;
        route.line.setStyle({ opacity });
        trials.get(legKey(route))?.line.setStyle({ opacity });
        route.number.setOpacity(opacity);
      });
    }

    function showVoyage() {
      stopEditing();
      shownRoute = null;
      legHighlight.remove();
      statsPoints.remove();
      fadeOthers();
      markTabs();
      renderVoyage();
      side.scrollTop = 0;
      map.fitBounds(allBounds, { padding: [20, 20] });
    }

    function showLeg(route) {
      if (editing && editing !== route) stopEditing();
      shownRoute = route;
      fadeOthers();
      markTabs();
      legHighlight.setLatLngs(highlightPaths(route)).addTo(map).bringToBack();
      if (trials.has(legKey(route)) && !editing) manualWind(route);
      renderLeg(route);
      side.scrollTop = 0;
      map.fitBounds(L.latLngBounds(highlightPaths(route).flat()), { padding: [40, 40], maxZoom: 9 });
    }

    // Each of a leg's routes with its length and its wind, the auto route first.
    function routeList(route) {
      const list = [{ manual: false, nm: route.auto.nm, stats: route.auto.stats, mode: route.auto.mode }];
      const trial = trials.get(legKey(route));
      if (trial) {
        list.push({ manual: true, nm: pathNm(trial.path), stats: manualWinds.get(manualKey(route))?.stats ?? null, mode: trial.mode });
      }
      return list;
    }

    // The distance sailed grows by this factor when the boat tacks whenever the wind blows from
    // closer to the bow than it points: it then makes good cos(pointing) / cos(angle) of its speed.
    // Hours of light air count as sailed straight.
    function tackingFactor(offBow, pointing) {
      const radians = degrees => degrees * Math.PI / 180;
      return offBow.reduce((factor, share, degree) => {
        const off = degree + 0.5;
        return off < pointing ? factor + share * (Math.cos(radians(off)) / Math.cos(radians(pointing)) - 1) : factor;
      }, 1);
    }

    const sailedNm = one => one.nm * tackingFactor(one.stats.offBow, pointingDeg);

    const paceHtml = () =>
      `<div class="pace">Vitesse moyenne <input type="number" class="speed" min="1" max="15" step="0.5" value="${trialSpeed}"> nd · ` +
      `remonte au vent jusqu'à <input type="number" class="pointing" min="30" max="70" step="5" value="${pointingDeg}">° du vent</div>`;

    function listenPace(box) {
      box.querySelector('.speed')?.addEventListener('input', event => {
        const speed = Number(event.target.value);
        if (speed > 0) {
          trialSpeed = speed;
          markModified();
          updateFigures();
        }
      });
      box.querySelector('.pointing')?.addEventListener('input', event => {
        const pointing = Number(event.target.value);
        if (pointing >= 30 && pointing <= 70) {
          pointingDeg = pointing;
          markModified();
          updateFigures();
        }
      });
    }

    // The figures that follow the speed and the pointing angle, redrawn without the fields being typed in.
    function updateFigures() {
      if (!shownRoute) {
        side.querySelector('.voyage-figures').innerHTML = voyageTableHtml();
        listenVoyageRows();
        return;
      }
      const figures = side.querySelector('.wind-figures');
      if (figures) figures.innerHTML = windTableHtml(shownRoute);
      const trialFiguresBox = side.querySelector('.trial .figures');
      if (trialFiguresBox) trialFiguresBox.innerHTML = trialFigures(shownRoute);
    }

    function voyageTableHtml() {
      const lines = (list, value) => list.map(one => `<div class="${one.manual ? 'manual-text' : ''}">${value(one)}</div>`).join('');
      const hours = one => (one.stats ? sailedNm(one) : one.nm) / trialSpeed;
      const rows = [...legRoutes.values()].map(route => {
        const { leg } = route;
        const list = routeList(route);
        const duration = one => (one.stats || one.mode === ROUTE_MODES.straight ? formatHours(hours(one)) : 'vent à calculer');
        const margin = one => {
          if (!one.stats && one.mode !== ROUTE_MODES.straight) return '—';
          const left = plannedHours(leg) - hours(one);
          return left >= 0 ? `+${formatHours(left)}` : `<span class="late">−${formatHours(left)}</span>`;
        };
        return `<tr data-leg="${escapeHtml(leg['Étape'])}" tabindex="0">` +
          `<td class="leg">${escapeHtml(leg['Étape'])}</td>` +
          `<td>${escapeHtml(leg['Zone / itinéraire'])}<div class="small">${escapeHtml(formatDate(leg['Départ prévu'], {}))} → ` +
          `${escapeHtml(formatDate(leg['Arrivée prévue'], {}))}</div></td>` +
          `<td>${lines(list, one => `${Math.round(one.nm)} NM`)}</td>` +
          `<td>${lines(list, duration)}</td>` +
          `<td>${lines(list, one => (one.stats ? windPercent(one.stats.shares.close) : '—'))}</td>` +
          `<td>${TIDE_WORDS[tideKind(tideStrength(utcDate(leg['Départ prévu']).getTime() + NOON_MS))]}</td>` +
          `<td>${lines(list, margin)}</td></tr>`;
      }).join('');
      const autos = [...legRoutes.values()].map(route => routeList(route)[0]);
      const totalNm = autos.reduce((sum, one) => sum + one.nm, 0);
      const totalHours = autos.reduce((sum, one) => sum + hours(one), 0);
      return `<table class="figures-table voyage-table"><thead><tr><th>Étape</th><th>Trajet</th><th>Distance</th>` +
        `<th>Durée en tirant des bords${why('tacking')}</th><th>Vent de face${why('shares')}</th>` +
        `<th>Marée au départ${why('tide')}</th><th>Marge${why('margin')}</th></tr></thead>` +
        `<tbody>${rows}</tbody>` +
        `<tfoot><tr class="total"><td></td><td>Parcours auto, en tout</td><td>${Math.round(totalNm)} NM</td>` +
        `<td>${formatHours(totalHours)}</td><td></td><td></td><td></td></tr></tfoot></table>`;
    }

    function listenVoyageRows() {
      side.querySelectorAll('.voyage-table tbody tr').forEach(row => {
        const open = () => goTo(legRoutes.get(row.dataset.leg));
        row.addEventListener('click', event => !event.target.closest('.why') && open());
        row.addEventListener('keydown', event => event.key === 'Enter' && open());
      });
    }

    function renderVoyage() {
      const first = formatDate(file.legs[0]['Départ prévu']);
      const last = formatDate(file.legs.at(-1)['Arrivée prévue']);
      side.innerHTML =
        `<h2>Le voyage · ${file.legs.length} étapes</h2>` +
        `<div class="small">Du ${escapeHtml(first)} au ${escapeHtml(last)}. Ports aux positions du tableur, parcours calculés entre eux. ` +
        `Parcours auto en bleu, parcours manuel en violet. Cliquer sur une étape pour son détail.</div>` +
        paceHtml() +
        `<div class="voyage-figures">${voyageTableHtml()}</div>` +
        `<p class="credit">Vent : statistiques d'Open-Meteo.com (CC BY 4.0), pas une prévision.</p>`;
      listenPace(side);
      listenVoyageRows();
    }


    // The workbook's distance stays first: the computed lengths are ours, and say so.
    function legDistances(route) {
      const trial = trials.get(legKey(route));
      return `Tableur : ${escapeHtml(formatDistance(route.leg['Distance estimée (NM)']))} · ` +
        `parcours auto : ${Math.round(route.auto.nm)} NM${route.auto.mode === ROUTE_MODES.straight ? ' (ligne droite)' : ''}` +
        (trial ? ` · <span class="manual-text">parcours manuel : ${Math.round(pathNm(trial.path))} NM</span>` : '');
    }

    // The leg's band under both its routes when it has a manual one.
    const highlightPaths = route => (trials.has(legKey(route)) ? [route.path, trials.get(legKey(route)).path] : [route.path]);

    function renderLeg(route) {
      const { leg } = route;
      const trial = trials.get(legKey(route));
      side.innerHTML =
        `<h2>Étape ${escapeHtml(leg['Étape'])} · ${escapeHtml(leg['Zone / itinéraire'])}</h2>` +
        `<div class="small">${escapeHtml(formatDate(leg['Départ prévu']))} → ${escapeHtml(formatDate(leg['Arrivée prévue']))} · ` +
        `${plannedHours(leg) / 24} jours prévus</div>` +
        `<div class="small leg-distances">${legDistances(route)}</div>` +
        (route.auto.missing ? `<div class="small warning">Parcours auto absent du fichier : tracé en ligne droite, ./update.sh le calcule.</div>` : '') +
        `<div class="trial"></div>` +
        `<h3>Vers d'autres outils</h3><div class="small leg-links"></div>` +
        `<div class="wind-block"></div>` +
        tideHtml(route) +
        `<p class="credit">Vent : statistiques d'Open-Meteo.com (CC BY 4.0), pas une prévision.</p>`;
      showTrialPanel();
      renderWindBlock(route);
      showLegLinks(route);
      if (trial) loadCoastMask();
    }

    function showLegLinks(route) {
      const box = side.querySelector('.leg-links');
      if (!box || shownRoute !== route) return;
      const trial = trials.get(legKey(route));
      const gpxName = `NJORD_2027_etape${legKey(route)}.gpx`;
      const gpxFile = () => new File([legGpx(route)], gpxName, { type: 'application/gpx+xml' });
      // A tablet or a phone hands the file to an app through its share sheet, where the browser allows a .gpx.
      const shareable = navigator.canShare?.({ files: [gpxFile()] });
      box.innerHTML = `<a href="${windyRouteLink(route.path)}" target="_blank" rel="noopener">Parcours auto sur Windy ↗</a>` +
        (trial ? ` · <a href="${windyRouteLink(trial.path)}" target="_blank" rel="noopener" class="manual-text">Parcours manuel sur Windy ↗</a>` : '') +
        ` (la vitesse du bateau et les milles se règlent une fois dans Windy)` +
        `<div class="gpx"><button type="button" class="gpx-download">GPX de l'étape</button>` +
        (shareable ? `<button type="button" class="gpx-share">Envoyer vers une appli…</button>` : '') +
        `<button type="button" class="kml-download">KML (Google Earth)</button>` +
        `<span>${trial ? 'parcours auto et manuel' : 'parcours auto'} : le GPX pour Navionics ou un traceur, le KML pour ` +
        `Google Earth (Projet › Importer) ; à vérifier sur la carte marine</span></div>`;
      box.querySelector('.gpx-download').addEventListener('click', () => download(gpxName, gpxFile()));
      box.querySelector('.kml-download').addEventListener('click', () =>
        download(gpxName.replace(/\.gpx$/, '.kml'), new Blob([legKml(route)], { type: 'application/vnd.google-earth.kml+xml' })));
      box.querySelector('.gpx-share')?.addEventListener('click', () => {
        navigator.share({ files: [gpxFile()], title: gpxName })
          .catch(error => error.name !== 'AbortError' && showMessage(`Envoi refusé par le navigateur : « GPX de l'étape » le télécharge.`, 'error'));
      });
    }

    const NOON_MS = 43_200_000;
    // A leg may start a few days early or late: the strip shows them around its dates.
    const TIDE_MARGIN_DAYS = 3;
    const TIDE_WORDS = { springs: 'vives-eaux', neaps: 'mortes-eaux', between: 'entre les deux' };
    const TIDE_PHRASES = { springs: 'en vives-eaux', neaps: 'en mortes-eaux', between: 'entre les deux' };
    const MOON_SIGNS = { new: ['🌑', 'nouvelle lune'], first: ['🌓', 'premier quartier'], full: ['🌕', 'pleine lune'], last: ['🌗', 'dernier quartier'] };

    // From pale (neaps) to the route's blue (springs), one hue as a scale of strength should be.
    function tideColour(strength) {
      const [pale, deep] = [[227, 234, 242], [29, 78, 137]];
      return `rgb(${pale.map((value, i) => Math.round(value + (deep[i] - value) * strength)).join(', ')})`;
    }

    function tideHtml(route) {
      const { leg } = route;
      const departure = utcDate(leg['Départ prévu']).getTime();
      const arrival = utcDate(leg['Arrivée prévue']).getTime();
      const days = [];
      for (let time = departure - TIDE_MARGIN_DAYS * MOON_DAY_MS; time <= arrival + TIDE_MARGIN_DAYS * MOON_DAY_MS; time += MOON_DAY_MS) {
        days.push({ time, strength: tideStrength(time + NOON_MS) });
      }
      const phases = moonPhases(days[0].time, days.at(-1).time + MOON_DAY_MS);
      const iso = time => new Date(time).toISOString().slice(0, 10);
      const cells = days.map(({ time, strength }) => {
        const phase = phases.find(one => one.time >= time && one.time < time + MOON_DAY_MS);
        const sailing = time >= departure && time <= arrival;
        return `<span class="${sailing ? 'leg-day' : ''}" style="background: ${tideColour(strength)}" ` +
          `title="${dayMonth(iso(time), 0)} : ${TIDE_WORDS[tideKind(strength)]}${phase ? `, ${MOON_SIGNS[phase.kind][1]}` : ''}">` +
          `${phase ? MOON_SIGNS[phase.kind][0] : ''}</span>`;
      }).join('');
      const marks = days.map(({ time }) => `<span>${time === departure ? '▲ départ' : time === arrival ? '▲ arrivée' : ''}</span>`).join('');
      const kindOn = time => TIDE_PHRASES[tideKind(tideStrength(time + NOON_MS))];
      return `<h3>Marée forte ou faible aux dates de l'étape ?${why('tide')}</h3>` +
        `<div><b>Départ ${kindOn(departure)}, arrivée ${kindOn(arrival)}.</b></div>` +
        `<div class="tide-strip">${cells}</div><div class="tide-marks">${marks}</div>` +
        `<div class="small">Du ${dayMonth(iso(days[0].time), 0)} au ${dayMonth(iso(days.at(-1).time), 0)}, souligné en jaune : les jours de l'étape. ` +
        `Clair : mortes-eaux (petit marnage), foncé : vives-eaux (grand marnage, courants forts). 🌑 nouvelle lune, 🌓 premier quartier, 🌕 pleine lune, 🌗 dernier quartier.</div>`;
    }

    const EXPORT_NOTE = 'Tracé calculé pour préparer le voyage, pas une route de navigation : à vérifier sur la carte marine.';

    // What a leg's exports carry: its two ports, and each of its routes with its length.
    function legExport(route) {
      const { leg } = route;
      const key = legKey(route);
      const trial = trials.get(key);
      return {
        key,
        ports: [
          [leg['Position embarquement'], `${key} départ · ${leg['Embarquement hypothétique'] ?? ''}`],
          [leg['Position débarquement'], `${key} arrivée · ${leg['Débarquement hypothétique'] ?? ''}`],
        ],
        routes: [{ name: ROUTE_NAMES.auto, letter: 'A', path: route.path, nm: route.auto.nm },
          ...(trial ? [{ name: ROUTE_NAMES.manual, letter: 'M', path: trial.path, nm: pathNm(trial.path) }] : [])]
          .map(one => ({ ...one, title: `Étape ${key} · parcours ${one.name} (${Math.round(one.nm)} NM)` })),
      };
    }

    // For a navigation app or a chart plotter: each route twice, as a route and as a track, since
    // some apps import only one of the two.
    function legGpx(route) {
      const { key, ports, routes } = legExport(route);
      const point = (tag, [lat, lon], name) =>
        `<${tag} lat="${lat.toFixed(5)}" lon="${lon.toFixed(5)}">${name ? `<name>${escapeXml(name)}</name>` : ''}</${tag}>`;
      const note = `<desc>${EXPORT_NOTE}</desc>`;
      return `<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="NJORD parcours" xmlns="http://www.topografix.com/GPX/1/1">\n` +
        ports.map(([at, name]) => `${point('wpt', at, name)}\n`).join('') +
        routes.map(({ letter, path, title }) => {
          const name = `<name>${escapeXml(title)}</name>`;
          return `<rte>${name}${note}${path.map((at, i) => point('rtept', at, `${key}${letter}${String(i + 1).padStart(2, '0')}`)).join('')}</rte>\n` +
            `<trk>${name}${note}<trkseg>${path.map(at => point('trkpt', at)).join('')}</trkseg></trk>\n`;
        }).join('') +
        `</gpx>\n`;
    }

    // For Google Earth, which reads KML but not GPX: the routes in the map's colours (KML writes a
    // colour as alpha, blue, green, red).
    function legKml(route) {
      const { key, ports, routes } = legExport(route);
      const kmlColour = css => `ff${css.slice(5, 7)}${css.slice(3, 5)}${css.slice(1, 3)}`;
      const coordinates = path => path.map(([lat, lon]) => `${lon.toFixed(5)},${lat.toFixed(5)},0`).join(' ');
      return `<?xml version="1.0" encoding="UTF-8"?>\n<kml xmlns="http://www.opengis.net/kml/2.2"><Document>\n` +
        `<name>${escapeXml(`Étape ${key} · ${route.leg['Zone / itinéraire'] ?? ''}`)}</name><description>${EXPORT_NOTE}</description>\n` +
        `<Style id="auto"><LineStyle><color>${kmlColour(ROUTE_COLOR)}</color><width>4</width></LineStyle></Style>\n` +
        `<Style id="manuel"><LineStyle><color>${kmlColour(TRIAL_COLOR)}</color><width>4</width></LineStyle></Style>\n` +
        ports.map(([at, name]) => `<Placemark><name>${escapeXml(name)}</name><Point><coordinates>${coordinates([at])}</coordinates></Point></Placemark>\n`).join('') +
        routes.map(({ name, path, title }) => `<Placemark><name>${escapeXml(title)}</name><styleUrl>#${name}</styleUrl>` +
          `<LineString><tessellate>1</tessellate><coordinates>${coordinates(path)}</coordinates></LineString></Placemark>\n`).join('') +
        `</Document></kml>\n`;
    }

    const WIND_ROWS = [
      ['close', 'Vent de face (près)'],
      ['reach', 'De côté (travers)'],
      ['run', "De l'arrière (portant)"],
      ['light', 'Trop peu de vent'],
      ['strong', 'Force 6 et plus'],
      ['gale', 'Force 7 et plus'],
    ];

    // What a « ? » explains: only what the figures beside it need.
    const EXPLANATIONS = {
      roses: () => `Chaque heure, la direction du vent est prise par rapport au cap du parcours à ce point : un vent du ` +
        `nord vient de l'avant quand le bateau monte au nord. Un pétale n'est donc pas un point : il réunit toutes les ` +
        `heures, de tous les points, où le vent venait de cette direction. Chaque point pèse pour les milles qu'il représente.`,
      period: () => `Le vent heure par heure tous les ${windStats.spacingNm} NM sur le parcours (les ronds blancs sur la ` +
        `carte), d'après les archives d'Open-Meteo. Des statistiques sur des années passées, pas une prévision : elles ` +
        `disent ce qui est probable à ces dates, pas le temps qu'il fera.`,
      tacking: () => {
        const share = angle => Math.round(100 * Math.cos(pointingDeg * Math.PI / 180) / Math.cos(angle * Math.PI / 180));
        const examples = [0, 20, 40].filter(angle => angle < pointingDeg).map((angle, i) =>
          `${share(angle)} %${i ? ` à ${angle}°${i === 1 ? " de l'avant" : ''}` : ' de sa vitesse vent droit devant'}`).join(', ');
        return `Le bateau ne remonte pas plus près que ${pointingDeg}° du vent. Quand le vent vient de plus près de ` +
          `l'avant, il zigzague et avance moins vite vers son but : ${examples}. Ces heures-là comptent à vitesse ` +
          `réduite, les autres à la vitesse moyenne. La distance est le chemin parcouru sur l'eau : à la même vitesse, ` +
          `elle s'allonge comme la durée. Sous ${windStats.thresholds.lightKn} nd de vent, pas d'allure : ces heures ` +
          `comptent comme route directe. Un parcours en ligne droite (canal) n'a pas de vent calculé : sa durée est en route directe.`;
      },
      shares: () => {
        const t = windStats.thresholds;
        return `Vent de face : à moins de ${t.closeHauledDeg}° de l'avant ; de côté : jusqu'à ${t.runningDeg}° ; de ` +
          `l'arrière : au-delà. Sous ${t.lightKn} nd, trop peu de vent pour une allure : ces heures font la ligne « Trop peu de vent ». ` +
          `Force 6 : ${t.strongKn} nd et plus ; force 7 : ${t.galeKn} nd et plus.`;
      },
      years: () => `La part de vent de face de l'année la plus facile et de la plus dure, de ${windStats.years[0]} ` +
        `à ${windStats.years[1]}.`,
      tide: () => `La marée, c'est d'abord le niveau de l'eau qui monte et descend deux fois par jour ; le courant de marée en ` +
        `découle. En vives-eaux, le marnage est le plus grand : pleine mer plus haute, basse mer plus basse (moins d'eau à ` +
        `basse mer pour entrer au port ou mouiller), et les courants sont les plus forts. En mortes-eaux, c'est l'inverse : ` +
        `marnage faible, mais une pleine mer plus basse, qui peut ne pas suffire pour un port à seuil ou qui assèche. Les ` +
        `vives-eaux suivent la nouvelle et la pleine lune, les mortes-eaux les quartiers, sur les côtes atlantiques d'Europe ` +
        `avec un jour et demi de retard environ, plus ou moins selon le port. Calculé d'après la Lune seule, sans données ` +
        `de marée : ni heures ni hauteurs en mètres, qui changent d'un port à l'autre. En Méditerranée et en Baltique, la ` +
        `marée est faible et compte peu.`,
      margin: () => `Les jours que le tableur prévoit pour l'étape, dates de départ et d'arrivée comprises, moins la durée ` +
        `en tirant des bords à la vitesse moyenne.`,
    };

    const why = key => ` <button type="button" class="why" data-why="${key}" aria-label="Explication">?</button>`;
    const whyTip = document.querySelector('.why-tip');

    function showWhy(button) {
      whyTip.innerHTML = EXPLANATIONS[button.dataset.why]();
      whyTip.hidden = false;
      const at = button.getBoundingClientRect();
      whyTip.style.left = `${Math.max(4, Math.min(at.left - 8, innerWidth - whyTip.offsetWidth - 4))}px`;
      const below = at.bottom + 6;
      whyTip.style.top = `${below + whyTip.offsetHeight > innerHeight ? Math.max(4, at.top - whyTip.offsetHeight - 6) : below}px`;
    }

    // Hover or focus shows an explanation; a tap, where there is no hover, shows it until the next one.
    ['pointerover', 'focusin', 'click'].forEach(type => document.addEventListener(type, event => {
      const button = event.target.closest?.('.why');
      if (button) showWhy(button);
      else if (type === 'click') whyTip.hidden = true;
    }));
    document.addEventListener('pointerout', event => event.pointerType === 'mouse' && event.target.closest?.('.why') && (whyTip.hidden = true));
    document.addEventListener('focusout', event => event.target.closest?.('.why') && (whyTip.hidden = true));
    side.addEventListener('scroll', () => { whyTip.hidden = true; });
    side.addEventListener('click', event => event.target.closest('.wind-manual') && shownRoute && manualWind(shownRoute));

    function manualProgressHtml(entry) {
      if (entry.error) {
        return progressBar(0, weatherErrorMessage(entry.error, 'Vent du parcours manuel indisponible.'), true) +
          `<button type="button" class="wind-manual">Réessayer</button>`;
      }
      return progressBar(entry.total ? entry.done / entry.total : 0, `Vent du parcours manuel : ${entry.done} / ${entry.total} requêtes` +
        (entry.pause ? ` · pause imposée par le quota Open-Meteo, reprise dans ${entry.pause} s` : ''));
    }

    function closeHauledRange(stats) {
      const byYear = Object.entries(stats.byYear).map(([year, shares]) => ({ year, close: shares.close }));
      const easiest = byYear.reduce((a, b) => (b.close < a.close ? b : a));
      const hardest = byYear.reduce((a, b) => (b.close > a.close ? b : a));
      return `${windPercent(easiest.close)} (${easiest.year}) à ${windPercent(hardest.close)} (${hardest.year})`;
    }

    // Each route's length and time at the chosen speed, straight and tacking, then its share of
    // the time by point of sail; a route whose wind is missing shows a dash.
    function windTableHtml(route) {
      const routes = routeList(route);
      const cells = (value, needsWind = true) => routes.map(one =>
        `<td${one.manual ? ' class="manual-text"' : ''}>${one.stats || !needsWind ? value(one) : '—'}</td>`).join('');
      const direct = one => one.nm / trialSpeed;
      const tacking = one => sailedNm(one) / trialSpeed;
      return `<table class="figures-table"><tr><th>En route directe</th><th>Parcours auto</th>` +
        (routes.length > 1 ? `<th class="manual-text">Parcours manuel</th>` : '') + `</tr>` +
        `<tr><td>Distance</td>${cells(one => `${Math.round(one.nm)} NM`, false)}</tr>` +
        `<tr><td>Durée à ${trialSpeed} nd</td>${cells(one => formatHours(direct(one)), false)}</tr>` +
        `<tr class="group"><th colspan="${routes.length + 1}">En tirant des bords${why('tacking')}</th></tr>` +
        `<tr><td>Distance</td>${cells(one => `${Math.round(sailedNm(one))} NM (+${Math.round(sailedNm(one) - one.nm)})`)}</tr>` +
        `<tr><td>Durée à ${trialSpeed} nd</td>${cells(one =>
          `${formatHours(tacking(one))} (+${formatHours(tacking(one) - direct(one))})`)}</tr>` +
        `<tr><td>Marge${why('margin')}</td>${cells(one => {
          // A route in a straight line has no wind: its margin is on its time sailed straight.
          if (!one.stats && one.mode !== ROUTE_MODES.straight) return '—';
          const left = plannedHours(route.leg) - (one.stats ? tacking(one) : direct(one));
          return left >= 0 ? `+${formatHours(left)}` : `<span class="warning">−${formatHours(left)}</span>`;
        }, false)}</tr>` +
        `<tr class="group"><th colspan="${routes.length + 1}">Part du temps${why('shares')}</th></tr>` +
        WIND_ROWS.map(([key, label]) => `<tr><td>${label}</td>${cells(one => windPercent(one.stats.shares[key]))}</tr>`).join('') +
        `<tr><td>Vent de face selon les années${why('years')}</td>${cells(one => closeHauledRange(one.stats))}</tr>` +
        `</table>`;
    }

    const manualKey = route => {
      const trial = trials.get(legKey(route));
      return trial && routeFingerprint(route.leg, trial.mode, trial.points.map(({ lat, lng }) => [lat, lng]));
    };

    // The wind of a manual route sailed by sea, computed in the browser once per route definition.
    function manualWind(route) {
      const key = manualKey(route);
      const trial = trials.get(legKey(route));
      if (!key || trial.mode !== ROUTE_MODES.sea || !trial.path) return null;
      if (!manualWinds.has(key) || manualWinds.get(key).error) {
        const entry = { done: 0, total: 0, pause: 0, stats: null, error: null };
        manualWinds.set(key, entry);
        routeWindStats(trial.path, route.leg, windStats, {
          onProgress: (done, total, pause) => {
            Object.assign(entry, { done, total, pause: pause ?? 0 });
            refreshWind(route, key);
          },
        })
          .then(stats => { entry.stats = stats; }, error => { entry.error = error; })
          .finally(() => refreshWind(route, key));
      }
      return manualWinds.get(key);
    }

    function refreshWind(route, key) {
      if (!shownRoute) {
        if (side.querySelector('.voyage-figures') && manualWinds.get(key)?.stats) updateFigures();
        return;
      }
      if (shownRoute !== route || manualKey(route) !== key) return;
      const entry = manualWinds.get(key);
      const column = side.querySelector('.manual-column');
      // Only the progress of the requests is redrawn in place; the result changes the common scale.
      if (column && entry && !entry.stats && !entry.error) {
        column.innerHTML = manualColumnHtml(route, windowPeak(route));
        return;
      }
      renderWindBlock(route);
      const figures = side.querySelector('.trial .figures');
      if (figures) figures.innerHTML = trialFigures(route);
    }

    function drawStatsPoints(route) {
      statsPoints.clearLayers();
      routeList(route).forEach(one => one.stats?.points.forEach(([lat, lon]) => L.circleMarker([lat, lon], {
        radius: 5, color: one.manual ? TRIAL_COLOR : ROUTE_COLOR, weight: 2, fillColor: '#fff', fillOpacity: 1, interactive: false,
      }).addTo(statsPoints)));
      statsPoints.addTo(map);
    }

    // Both roses on one scale, the largest petal of either, so that a longer petal is a larger share.
    function windowPeak(route) {
      const sectors = routeList(route).filter(one => one.stats)
        .flatMap(one => one.stats.aroundBoat.map(sector => sector.reduce((a, b) => a + b, 0)));
      return sectors.length ? Math.max(...sectors) : 1;
    }

    function manualColumnHtml(route, peak) {
      const trial = trials.get(legKey(route));
      const head = `<h4 class="manual-text">Parcours manuel · ${Math.round(pathNm(trial.path))} NM</h4>`;
      const entry = manualWinds.get(manualKey(route));
      if (!entry) return head + `<div class="small"><button type="button" class="wind-manual">Calculer son vent</button></div>`;
      if (!entry.stats) return head + manualProgressHtml(entry);
      return head + boatRoseSvg(entry.stats.aroundBoat, windStats.thresholds, peak, 'manual');
    }

    function windBlockHtml(route) {
      const { leg } = route;
      const { thresholds: t, years: [first, last], marginDays } = windStats;
      const trial = trials.get(legKey(route));
      const bySea = [route.auto.mode, trial?.mode].includes(ROUTE_MODES.sea);
      if (!bySea) {
        return `<h3>Durées</h3><div class="small">Étape en ligne droite (canal) : pas de vent calculé, durées en route directe.</div>` +
          paceHtml() + `<div class="wind-figures">${windTableHtml(route)}</div>`;
      }
      const peak = windowPeak(route);
      const autoHead = `<h4>Parcours auto · ${Math.round(route.auto.nm)} NM</h4>`;
      const autoColumn = route.auto.stats
        ? autoHead + boatRoseSvg(route.auto.stats.aroundBoat, t, peak, 'auto')
        : autoHead + `<div class="small">${route.auto.mode === ROUTE_MODES.straight
          ? 'En ligne droite (canal) : pas de vent calculé.'
          : 'Vent à calculer : ./update.sh le calcule pour le parcours auto.'}</div>`;
      return `<h3>Le vent vu du bateau</h3>` +
        `<div class="small">Chaque pétale est une direction d'où vient le vent par rapport au bateau, l'avant en haut ` +
        `quel que soit le cap. Sa longueur : la part du temps ; ses couleurs : la force. ` +
        `${trial ? 'Les deux roses ont la même échelle. ' : ''}Survoler un pétale pour le détail.${why('roses')}</div>` +
        `<div class="roses"><div>${autoColumn}</div>` +
        (trial && trial.mode === ROUTE_MODES.sea ? `<div class="manual-column">${manualColumnHtml(route, peak)}</div>` : '') +
        `</div>` +
        `<p class="period">Le vent du ${dayMonth(leg['Départ prévu'], -marginDays)} au ${dayMonth(leg['Arrivée prévue'], marginDays)}, ` +
        `chaque année de ${first} à ${last}${why('period')}<span>les dates de l'étape, ${marginDays} jours de marge de chaque côté</span></p>` +
        speedScale() +
        paceHtml() +
        `<div class="wind-figures">${windTableHtml(route)}</div>`;
    }

    function renderWindBlock(route) {
      const block = side.querySelector('.wind-block');
      if (!block || shownRoute !== route) return;
      block.innerHTML = windBlockHtml(route);
      listenPace(block);
      listenRoseTips(route);
      drawStatsPoints(route);
    }

    // Where a petal's wind comes from, seen from the boat, and the point of sail it means.
    function petalName(sector, t) {
      const angle = sector * 22.5;
      const off = Math.min(angle, 360 - angle);
      const from = off === 0 ? "de l'avant" : off === 180 ? "de l'arrière"
        : `de ${off.toLocaleString('fr-CH')}° sur ${angle < 180 ? 'tribord' : 'bâbord'}`;
      const allure = off < t.closeHauledDeg ? 'près' : off < t.runningDeg ? 'travers' : 'portant';
      return `Vent ${from} · ${allure}`;
    }

    // The tooltip of a petal: its share of the time by force, and the other route's same petal.
    function listenRoseTips(route) {
      const tip = document.querySelector('.rose-tip');
      const list = routeList(route);
      const stats = { auto: list[0].stats, manual: list[1]?.stats ?? null };
      const names = { auto: 'parcours auto', manual: 'parcours manuel' };
      side.querySelectorAll('.boat-rose').forEach(svg => {
        const own = svg.dataset.route;
        const other = own === 'auto' ? 'manual' : 'auto';
        svg.addEventListener('pointermove', event => {
          const hit = event.target.closest('.hit');
          if (!hit) {
            tip.hidden = true;
            return;
          }
          const sector = Number(hit.dataset.sector);
          const bands = stats[own].aroundBoat[sector];
          const total = bands.reduce((a, b) => a + b, 0);
          tip.innerHTML = `<b>${petalName(sector, windStats.thresholds)}</b><br>` +
            `<span class="${own === 'manual' ? 'manual-text' : ''}">${tipPercent(total)} du temps sur le ${names[own]}</span><br>` +
            `<span class="bands">` + SPEED_BANDS.map((band, i) =>
              `<span class="swatch" style="background:${band.color}"></span>${band.force} ${tipPercent(bands[i])}`).join(' ') + `</span>` +
            (stats[other]
              ? `<br><span class="other">Sur le ${names[other]} : ${tipPercent(stats[other].aroundBoat[sector].reduce((a, b) => a + b, 0))}</span>`
              : '');
          tip.hidden = false;
          tip.style.left = `${Math.max(4, Math.min(event.clientX + 14, innerWidth - tip.offsetWidth - 4))}px`;
          tip.style.top = `${Math.min(event.clientY + 14, innerHeight - tip.offsetHeight - 4)}px`;
        });
        svg.addEventListener('pointerleave', () => { tip.hidden = true; });
      });
    }

    // The rose of all a route's points, turned so that the bow is up; the limits of the points of
    // sail are drawn over it, and each petal's whole sector answers the pointer.
    function boatRoseSvg(aroundBoat, t, peak, routeName) {
      const { wedges } = roseWedges({ counts: aroundBoat, total: 1 }, peak);
      const [center, radius] = [ROSE_CENTER, ROSE_RADIUS];
      const rings = [0.25, 0.5, 0.75, 1].map(k => `<circle cx="${center}" cy="${center}" r="${radius * k}" class="ring"/>`).join('');
      const ringLabels = [0.25, 0.5, 0.75, 1].map(k =>
        `<text x="${center + 3}" y="${center - radius * k - 2}" class="ring-label">${Math.round(peak * k * 100)} %</text>`).join('');
      const limits = [t.closeHauledDeg, t.runningDeg, 360 - t.runningDeg, 360 - t.closeHauledDeg]
        .map(angle => {
          const [x, y] = rosePoint(radius + 8, angle).split(',');
          return `<line x1="${center}" y1="${center}" x2="${x}" y2="${y}" class="allure-limit"/>`;
        }).join('');
      const label = (x, y, sideName, allure) =>
        `<text x="${x}" y="${y}" class="cardinal">${sideName}</text><text x="${x}" y="${y + 13}" class="allure">${allure}</text>`;
      const hits = aroundBoat.map((_, s) =>
        `<path d="M${center},${center} L${rosePoint(radius, s * 22.5 - 11.25)} A${radius},${radius} 0 0 1 ${rosePoint(radius, s * 22.5 + 11.25)}Z" ` +
        `class="hit" data-sector="${s}"/>`).join('');
      return `<svg viewBox="-46 -30 332 300" class="rose boat-rose" data-route="${routeName}" role="img" aria-label="Rose des vents vue du bateau">` +
        rings + wedges + limits +
        `<path d="M120,110 C124,115 125,123 123,130 L117,130 C115,123 116,115 120,110Z" class="hull"/>` +
        ringLabels +
        label(center, center - radius - 30, 'avant', 'près') +
        label(center, center + radius + 18, 'arrière', 'portant') +
        label(center + radius + 26, center - 4, 'tribord', 'travers') +
        label(center - radius - 26, center - 4, 'bâbord', 'travers') +
        hits +
        `</svg>`;
    }


    // The coast mask is the site's: sea-mask.png and the site's copy of the routes file are written
    // together, so its place on the globe is read from the latter, whatever file is open.
    function loadCoastMask() {
      coastMask ??= new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => {
          const canvas = Object.assign(document.createElement('canvas'), { width: image.width, height: image.height });
          const context = canvas.getContext('2d', { willReadFrequently: true });
          context.drawImage(image, 0, 0);
          const { data } = context.getImageData(0, 0, image.width, image.height);
          resolve({ ...siteFile.mask, width: image.width, height: image.height, data });
        };
        image.onerror = () => reject(new Error(`${siteFile.mask.file} introuvable`));
        image.src = siteFile.mask.file;
      }).then(
        mask => {
          coast = mask;
          trials.forEach((trial, key) => placePassages(legRoutes.get(key), trial.points, trial.mode));
        },
        () => {
          trialMessage = 'Côtes indisponibles : les passages ne sont ni contrôlés ni contournés.';
          showTrialPanel();
        },
      );
      return coastMask;
    }

    // The mask's grey levels, written by tools/export_voyage.py: open sea, closer to the coast
    // than the computed path keeps, land.
    function coastAt(mask, { lat, lng }) {
      const row = Math.floor((mask.north - lat) / mask.dlat);
      const col = Math.floor((lng - mask.west) / mask.dlon);
      if (row < 0 || col < 0 || row >= mask.height || col >= mask.width) return null;
      const level = mask.data[4 * (row * mask.width + col)];
      return level < 64 ? 'sea' : level < 192 ? 'coast' : 'land';
    }

    // Straight between the passages until the mask is there, by sea once it is; a route in « ligne
    // droite » (a canal: the coastline has none) joins them straight, on land if it must.
    function trialPath(route, points, mode) {
      const stops = [route.ends[0], ...points.map(({ lat, lng }) => [lat, lng]), route.ends[1]];
      if (!coast || mode === ROUTE_MODES.straight) return stops;
      return stops.slice(1).reduce((path, to, i) => {
        const key = `${stops[i]}>${to}`;
        if (!seaStretches.has(key)) seaStretches.set(key, seaRoute(coast, stops[i], to));
        return [...path, ...seaStretches.get(key).slice(1)];
      }, [stops[0]]);
    }

    // The passages of a leg's manual route, its path recomputed: drawn, not yet a change.
    function placePassages(route, points, mode) {
      const key = legKey(route);
      if (!trials.has(key)) {
        const line = L.polyline([], { color: TRIAL_COLOR, weight: 3, bubblingMouseEvents: false });
        line.bindTooltip(() => `<b>Étape ${escapeHtml(key)} · parcours manuel</b><br>` +
          `${Math.round(pathNm(trials.get(key)?.path ?? []))} NM`, { sticky: true });
        line.on('click', event => (editing ? addTrialPoint(event.latlng) : goTo(route)));
        trials.set(key, { points: [], path: null, mode: mode ?? route.auto.mode, markers: L.layerGroup(), line });
      }
      const trial = trials.get(key);
      try {
        trial.path = points.length ? trialPath(route, points, trial.mode) : null;
        trial.points = points;
        trialMessage = '';
      } catch (error) {
        trialMessage = `Point refusé : ${error.message}.`;
      }
      drawLeg(route);
    }

    // A passage placed, moved or removed by hand: the file has changed.
    function setPassages(route, points) {
      placePassages(route, points);
      markModified();
      showTrialPanel();
    }

    function drawLeg(route) {
      const key = legKey(route);
      const trial = trials.get(key);
      if (trial?.points.length) {
        trial.line.setLatLngs(trial.path).addTo(map);
        trial.markers.clearLayers().addTo(map);
        const editable = editing === route;
        trial.points.forEach((point, i) => {
          const marker = L.marker(point, {
            draggable: editable,
            interactive: editable,
            icon: L.divIcon({ className: 'trial-point', iconSize: [14, 14] }),
            title: editable ? 'Glisser pour déplacer, cliquer pour retirer' : '',
          }).addTo(trial.markers);
          if (!editable) return;
          marker
            .on('click', () => setPassages(route, trial.points.filter((_, j) => j !== i)))
            .on('dragend', event => {
              const at = rounded(event.target.getLatLng().wrap());
              trialMessage = refusal(route, at);
              if (trialMessage) {
                drawLeg(route);
                showTrialPanel();
              } else {
                setPassages(route, trial.points.map((other, j) => (j === i ? at : other)));
              }
            });
        });
      } else if (trial) {
        trial.markers.remove();
        trial.line.remove();
        trials.delete(key);
      }
      document.querySelector('.legend .trial-legend').hidden = trials.size === 0;
      markTabs();
      fadeOthers();
      if (shownRoute === route) {
        legHighlight.setLatLngs(highlightPaths(route));
        const distances = side.querySelector('.leg-distances');
        if (distances) distances.innerHTML = legDistances(route);
        showLegLinks(route);
        renderWindBlock(route);
      } else if (!shownRoute && side.querySelector('.voyage-figures')) {
        updateFigures();
      }
    }

    function startEditing(route) {
      editing = route;
      trialMessage = '';
      map.getContainer().classList.add('trial-mode');
      loadCoastMask();
      drawLeg(route);
      showTrialPanel();
    }

    function stopEditing() {
      if (!editing) return;
      const route = editing;
      editing = null;
      trialMessage = '';
      map.getContainer().classList.remove('trial-mode');
      drawLeg(route);
      if (shownRoute === route) {
        manualWind(route);
        renderWindBlock(route);
      }
      showTrialPanel();
    }

    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && editing) stopEditing();
    });

    // Passages are written with four decimals, about ten metres: rounded where they are placed,
    // they are the same before and after the file is saved, and so is the wind computed for them.
    const rounded = ({ lat, lng }) => L.latLng(Math.round(lat * 1e4) / 1e4, Math.round(lng * 1e4) / 1e4);

    // A new passage goes where it lengthens the leg least: a click near a stretch bends that stretch.
    function insertionIndex(route, points, at) {
      const stops = [L.latLng(route.ends[0]), ...points, L.latLng(route.ends[1])];
      let best = 0;
      let bestExtra = Infinity;
      for (let i = 0; i < stops.length - 1; i++) {
        const extra = map.distance(stops[i], at) + map.distance(at, stops[i + 1]) - map.distance(stops[i], stops[i + 1]);
        if (extra < bestExtra) [best, bestExtra] = [i, extra];
      }
      return best;
    }

    // The only rule: no passage on land, except along a canal.
    function refusal(route, at) {
      if (straightMode(route)) return '';
      return coast && coastAt(coast, at) === 'land' ? 'Point refusé : il est à terre.' : '';
    }

    function addTrialPoint(latlng) {
      const at = rounded(latlng.wrap());
      trialMessage = refusal(editing, at);
      if (trialMessage) {
        showTrialPanel();
        return;
      }
      const points = [...(trials.get(legKey(editing))?.points ?? [])];
      points.splice(insertionIndex(editing, points, at), 0, at);
      setPassages(editing, points);
    }

    map.on('click', event => editing && addTrialPoint(event.latlng));

    function trialFigures(route) {
      if (!trials.has(legKey(route))) return 'Cliquer sur la carte pour poser un premier passage.';
      const nm = pathNm(trials.get(legKey(route)).path);
      const delta = nm - route.auto.nm;
      const sign = delta >= 0 ? '+' : '−';
      return `<b>${Math.round(nm)} NM</b>, ${sign}${Math.round(Math.abs(delta))} NM par rapport au parcours auto ` +
        `(${Math.round(route.auto.nm)} NM) ; ses durées et sa marge sont dans le tableau du vent ci-dessous.`;
    }

    function showTrialPanel() {
      const box = side.querySelector('.trial');
      const route = shownRoute;
      if (!box || !route) return;
      const points = trials.get(legKey(route))?.points ?? [];
      const isEditing = editing === route;
      if (!isEditing && !points.length) {
        box.innerHTML = `<button type="button" class="edit">Créer un parcours manuel</button>` +
          (trialMessage ? `<div class="warning">${escapeHtml(trialMessage)}</div>` : '');
      } else {
        box.innerHTML =
          `<h3>${isEditing ? 'Parcours manuel · modification' : 'Parcours manuel'}</h3>` +
          (isEditing
            ? `<div class="small">${straightMode(route)
              ? "Étape par un canal : poser les passages le long du canal, à terre s'il le faut ; ils sont reliés en ligne droite."
              : 'Cliquer sur la carte pour ajouter un passage : le parcours manuel est recalculé par la mer en passant par lui.'} ` +
              `Glisser un passage pour le déplacer, cliquer dessus pour le retirer.</div>`
            : '') +
          `<div class="figures">${trialFigures(route)}</div>` +
          (trialMessage ? `<div class="warning">${escapeHtml(trialMessage)}</div>` : '') +
          (points.length ? `<ol>${points.map(({ lat, lng }) => `<li>${lat.toFixed(4)}, ${lng.toFixed(4)}</li>`).join('')}</ol>` : '') +
          `<div class="small">Il entre dans le fichier de parcours avec « Enregistrer », en haut à droite.</div>` +
          `<div class="actions">` +
          (isEditing
            ? `<button type="button" class="done">Terminer</button>`
            : `<button type="button" class="edit">Modifier le parcours manuel</button>`) +
          (points.length ? `<button type="button" class="clear">Supprimer le parcours manuel</button>` : '') +
          `</div>`;
      }
      box.querySelector('.edit')?.addEventListener('click', () => startEditing(route));
      box.querySelector('.done')?.addEventListener('click', stopEditing);
      box.querySelector('.clear')?.addEventListener('click', () => setPassages(route, []));
    }


    // Opened from file://, the browser refuses fetch(): the page has to be served.
    async function start() {
      try {
        const response = await fetch(SITE_FILE_URL, { cache: 'no-store' });
        if (!response.ok) throw new Error(`${SITE_FILE_URL} : HTTP ${response.status}`);
        siteBytes = await response.arrayBuffer();
        siteFile = await readRoutesFile(siteBytes);
      } catch (error) {
        side.innerHTML =
          `<h2>Impossible d'afficher le parcours</h2><p>${escapeHtml(error.message)}</p>` +
          `<p>Lance <code>./update.sh</code>, puis <code>python3 -m http.server</code> à la racine du projet, ` +
          `et ouvre http://localhost:8000/app/.</p>`;
        return;
      }
      const kept = await storeGet(KEPT_FILE);
      const legacy = await legacyPassages;
      if (kept) {
        try {
          useFile(await readRoutesFile(kept.bytes), kept.bytes, kept);
          return;
        } catch (error) {
          showMessage(`Le fichier gardé dans ce navigateur ne se lit plus (${error.message}) : retour au fichier du site.`, 'error');
        }
      }
      if (Object.keys(legacy).length) {
        const manual = { ...manualOf(siteFile) };
        for (const [key, passages] of Object.entries(legacy)) {
          const route = siteFile.routes.find(one => one.leg['Étape'] === key && one.name === ROUTE_NAMES.auto);
          if (route) manual[key] = { mode: route.mode, passages };
        }
        useFile(siteFile, siteBytes, { origin: 'site', manual, changed: true });
        showMessage(`Les parcours manuels que la carte gardait dans ce navigateur sont repris (étapes ${Object.keys(legacy).join(', ')}) : ` +
          `« Enregistrer » les met dans le fichier de parcours.`);
        return;
      }
      useFile(siteFile, siteBytes, { origin: 'site' });
    }

    start();
  </script>
</body>
</html>
